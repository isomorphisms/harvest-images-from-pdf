name: Fetch real PDF fixtures

on:
  push:
    branches:
      - fixtures-real-pdfs
    paths:
      - .github/workflows/fetch-real-pdf-fixtures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-real-pdf-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fixture branch
        uses: actions/checkout@v4

      - name: Download redistributable PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixtures/pdfs

          curl --fail --location --retry 3 \
            https://arxiv.org/pdf/2203.11355 \
            --output fixtures/pdfs/origami-in-n-dimensions-2203.11355.pdf

          curl --fail --location --retry 3 \
            https://proceedings.mlr.press/v97/hanin19a/hanin19a.pdf \
            --output fixtures/pdfs/complexity-of-linear-regions-in-deep-networks.pdf

      - name: Verify exact fixture bytes
        shell: bash
        run: |
          set -euo pipefail
          cat <<'HASHES' | sha256sum --check --strict
          5cbcfdaff46b8ce38bf54e9f70aa8e92e66edb232e0763417ac99daa0f642770  fixtures/pdfs/origami-in-n-dimensions-2203.11355.pdf
          951f8f5c92c3d6b2da046168d02bdc058c12dacffe518c023fea60ca13ec4e25  fixtures/pdfs/complexity-of-linear-regions-in-deep-networks.pdf
          HASHES

      - name: Commit PDFs to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fixtures/pdfs/*.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add real PDF fixtures"
          git push
